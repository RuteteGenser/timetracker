<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="strip">
    <div id="column">
      <div class="colbtn" id="btn-settings">Settings</div>
      <div class="colbtn" id="btn-style">Style</div>
    </div>
  </div>
  <div id="overlay">
    <h1 id="overlay-title"></h1>
    <p>Coming in a later milestone. Press Space or tap Back.</p>
    <div class="back" id="overlay-back">Back</div>
  </div>
</div>
<div id="hint">&larr; &rarr; turn the knob (mouse wheel works too) &middot; Space presses the button &middot; or just tap</div>
<script type="module" src="app.js"></script>
</body>
</html>
