<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time tracker</title>
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>
<div id="stage">
  <div id="viewport">
    <div id="strip">
      <div id="column">
        <div class="colbtn" id="btn-settings">Settings</div>
        <div class="colbtn" id="btn-style">Style</div>
        <div class="colbtn" id="btn-reports">Reports</div>
        <div class="colbtn" id="btn-back">Back</div>
        <div class="colbtn" id="btn-archived">Archived</div>
      </div>
      <div class="tile addtile" id="addtile"><span class="plus">+</span><span class="cap">New project</span></div>
    </div>
  </div>
  <div id="note">
    <div class="note-head"><span class="note-title" id="note-title">What did you do?</span><span id="note-sub"></span></div>
    <div id="note-text"></div>
    <div id="note-keys"></div>
  </div>
  <div id="list">
    <h1 id="list-title"></h1>
    <p id="list-note"></p>
    <div id="list-rows"></div>
  </div>
  <div id="rep">
    <div id="rep-controls"></div>
    <div id="rep-period"></div>
    <div id="rep-chart"></div>
  </div>
  <div id="dt">
    <h1 id="dt-title">Date &amp; time</h1>
    <p id="dt-hint"></p>
    <div id="dt-cols"></div>
    <div id="dt-buttons">
      <div class="key" id="dt-cancel">Cancel</div>
      <div class="key accent" id="dt-save">Save</div>
    </div>
  </div>
  <div id="overlay">
    <h1 id="overlay-title"></h1>
    <p>Coming soon. Press Space or tap Back.</p>
    <div class="back" id="overlay-back">Back</div>
  </div>
</div>
<div id="hint">&larr; &rarr; turn the knob (mouse wheel works too) &middot; Space presses the button &middot; or just tap &middot; typing works in the note prompt</div>
<script type="module" src="app.js?v=22"></script>
</body>
</html>
